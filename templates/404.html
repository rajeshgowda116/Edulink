<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | EduLink</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --purple: #7c3aed;
      --purple-dark: #4c1d95;
      --orange: #f97316;
      --white: #ffffff;
      --text-dark: #1e1040;
      --text-mid: #5b6474;
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(255, 255, 255, 0.62);
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: #2d1060;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      overflow: hidden;
      position: relative;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 60% 30%, rgba(120, 60, 220, .55) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 20% 80%, rgba(80, 40, 180, .40) 0%, transparent 65%),
        radial-gradient(ellipse 50% 40% at 85% 75%, rgba(200, 100, 50, .22) 0%, transparent 60%),
        linear-gradient(135deg, #1a0640 0%, #2d1060 40%, #3a1580 70%, #1e0850 100%);
    }

    .bg-layer::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 12% 18%, rgba(255, 255, 255, .55) 0%, transparent 100%),
        radial-gradient(1px 1px at 28% 58%, rgba(255, 255, 255, .40) 0%, transparent 100%),
        radial-gradient(2px 2px at 52% 12%, rgba(255, 255, 255, .50) 0%, transparent 100%),
        radial-gradient(1px 1px at 68% 42%, rgba(255, 255, 255, .35) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 83% 22%, rgba(255, 255, 255, .50) 0%, transparent 100%),
        radial-gradient(1px 1px at 38% 78%, rgba(255, 255, 255, .30) 0%, transparent 100%);
    }

    .error-card {
      width: min(100%, 620px);
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 22px 70px rgba(0, 0, 0, .28);
      padding: 42px;
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 26px;
      text-decoration: none;
      color: var(--text-dark);
    }

    .logo-shield {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(234, 88, 12, .36);
      flex-shrink: 0;
    }

    .logo-shield svg {
      width: 24px;
      height: 24px;
      fill: white;
    }

    .brand span {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.55rem;
    }

    .error-code {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: clamp(5.5rem, 18vw, 9rem);
      line-height: .85;
      color: var(--purple-dark);
      text-shadow: 0 8px 24px rgba(76, 29, 149, .14);
    }

    h1 {
      font-family: 'Nunito', sans-serif;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 900;
      margin-top: 18px;
      color: var(--text-dark);
    }

    p {
      max-width: 460px;
      margin: 12px auto 28px;
      color: var(--text-mid);
      font-size: 1rem;
      line-height: 1.65;
      font-weight: 500;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 20px;
      border-radius: 8px;
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
      text-decoration: none;
      transition: transform .18s, box-shadow .18s, background .18s;
    }

    .btn-primary {
      color: var(--white);
      background: linear-gradient(135deg, var(--purple), var(--orange));
      box-shadow: 0 10px 24px rgba(124, 58, 237, .28);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 32px rgba(124, 58, 237, .34);
    }

    .btn-secondary {
      color: var(--purple-dark);
      background: rgba(124, 58, 237, .10);
      border: 1px solid rgba(124, 58, 237, .18);
    }

    .btn-secondary:hover {
      background: rgba(124, 58, 237, .16);
      transform: translateY(-1px);
    }

    @media (max-width: 560px) {
      body {
        padding: 18px;
      }

      .error-card {
        padding: 32px 22px;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="bg-layer"></div>

  <main class="error-card">
    <a class="brand" href="{% url 'home' %}">
      <span class="logo-shield" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" />
        </svg>
      </span>
      <span>EduLink</span>
    </a>

    <div class="error-code">404</div>
    <h1>Page not found</h1>
    <p>The page you are looking for may have been moved, renamed, or is not available in EduLink.</p>

    <div class="actions">
      <a class="btn btn-primary" href="{% url 'home' %}">Back to Home</a>
      <a class="btn btn-secondary" href="javascript:history.back()">Go Back</a>
    </div>
  </main>
</body>

</html>

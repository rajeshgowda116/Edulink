<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EduLink – Streamline Your College Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-light: #dbeafe;
      --bg: #f0f4ff;
      --white: #ffffff;
      --text-dark: #1e293b;
      --text-mid: #475569;
      --text-light: #94a3b8;
      --card-bg: #ffffff;
      --radius: 16px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-dark);
      min-height: 100vh;
    }

    /* ─── NAV ─── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 60px;
      background: var(--white);
      box-shadow: 0 1px 0 #e2e8f0;
      position: sticky; top: 0; z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      color: var(--text-dark);
      text-decoration: none;
    }

    .logo-icon {
      width: 38px; height: 38px;
      background: var(--blue);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }

    .logo-icon svg { width: 22px; height: 22px; fill: white; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-mid);
      font-size: 0.95rem;
      font-weight: 500;
      transition: color .2s;
    }
    .nav-links a:hover { color: var(--blue); }

    .nav-actions { display: flex; gap: 12px; align-items: center; }

    .btn-ghost {
      background: none; border: none;
      color: var(--text-dark); font-size: 0.95rem;
      font-weight: 600; cursor: pointer;
      padding: 8px 16px; border-radius: 8px;
      transition: background .2s;
    }
    .btn-ghost:hover { background: var(--blue-light); color: var(--blue); }

    .btn-primary {
      background: var(--blue);
      color: white;
      border: none; cursor: pointer;
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      transition: background .2s, transform .15s;
    }
    .btn-primary:hover { background: var(--blue-dark); transform: translateY(-1px); }

    /* ─── HERO ─── */
    .hero {
      text-align: center;
      padding: 64px 20px 0;
      background: linear-gradient(160deg, #e8f0fe 0%, #f0f4ff 60%, #f8faff 100%);
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      width: 700px; height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37,99,235,.07) 0%, transparent 70%);
      top: -200px; left: 50%; transform: translateX(-50%);
      pointer-events: none;
    }

    .hero h1 {
      font-family: 'Nunito', sans-serif;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 900;
      color: var(--text-dark);
      line-height: 1.15;
      margin-bottom: 14px;
    }

    .hero p {
      font-size: 1.15rem;
      color: var(--text-mid);
      margin-bottom: 36px;
    }

    .hero-btns {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 50px;
    }

    .hero-btns .btn-primary {
      padding: 14px 32px;
      font-size: 1rem;
      border-radius: 12px;
    }

    .btn-outline {
      background: white;
      border: 1.5px solid #d1d5db;
      color: var(--text-dark);
      padding: 13px 32px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s;
    }
    .btn-outline:hover { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }

    /* ─── HERO ILLUSTRATION ─── */
    .hero-illustration {
      max-width: 860px;
      margin: 0 auto;
      position: relative;
    }

    /* decorative floating icons */
    .float-icon {
      position: absolute;
      background: white;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex; align-items: center; gap: 8px;
      font-size: 0.78rem; font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      color: var(--text-mid);
      animation: floaty 3s ease-in-out infinite;
    }
    .float-icon svg { width: 18px; height: 18px; }
    .float-icon:nth-child(2) { animation-delay: .8s; }
    .float-icon:nth-child(3) { animation-delay: 1.6s; }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .fi-1 { top: 30px; left: 30px; }
    .fi-2 { top: 10px; right: 60px; }
    .fi-3 { top: 80px; right: 10px; }

    /* Campus SVG scene */
    .campus-scene {
      width: 100%;
      height: 340px;
    }

    /* ─── FEATURE CARDS ─── */
    .features {
      background: var(--white);
      padding: 20px 60px 60px;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .feature-card {
      background: var(--card-bg);
      border: 1.5px solid #e8edf5;
      border-radius: var(--radius);
      padding: 28px 20px 24px;
      text-align: center;
      transition: box-shadow .25s, transform .2s, border-color .2s;
      cursor: pointer;
    }

    .feature-card:hover {
      box-shadow: 0 8px 30px rgba(37,99,235,.12);
      border-color: var(--blue);
      transform: translateY(-4px);
    }

    .feature-icon {
      width: 72px; height: 72px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #f0f4ff;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    .feature-icon svg { width: 40px; height: 40px; }

    .feature-card h3 {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      color: var(--text-dark);
    }

    /* ─── Responsive ─── */
    @media (max-width: 900px) {
      nav { padding: 16px 24px; }
      .features { padding: 20px 20px 40px; }
      .feature-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 560px) {
      .nav-links { display: none; }
      .feature-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<!-- ── NAV ── -->
<nav>
  <a href="#" class="logo">
    <div class="logo-icon">

    </div>

  <ul class="nav-links">

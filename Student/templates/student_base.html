<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}EduLink{% endblock %}</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
  {% block extra_css %}{% endblock %}
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --sidebar-w: 220px;
      --purple: #7c3aed;
      --blue: #2563eb;
      --orange: #f97316;
      --green: #16a34a;
      --white: #ffffff;
      --text-dark: #1e1b4b;
      --text-mid: #4b5563;
      --text-light: #94a3b8;
      --border: rgba(255, 255, 255, 0.22);
      --radius: 16px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #6d28d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── BACKGROUND ── */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 70% 55% at 55% 25%, rgba(167, 100, 255, .55) 0%, transparent 65%),
        radial-gradient(ellipse 50% 45% at 15% 75%, rgba(109, 40, 217, .50) 0%, transparent 60%),
        radial-gradient(ellipse 40% 35% at 90% 80%, rgba(234, 88, 12, .18) 0%, transparent 55%),
        linear-gradient(140deg, #4c1d95 0%, #6d28d9 35%, #7c3aed 65%, #5b21b6 100%);
    }

    .bg-layer::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 10% 15%, rgba(255, 255, 255, .55) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 55%, rgba(255, 255, 255, .38) 0%, transparent 100%),
        radial-gradient(2px 2px at 50% 10%, rgba(255, 255, 255, .45) 0%, transparent 100%),
        radial-gradient(1px 1px at 65% 40%, rgba(255, 255, 255, .30) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 80% 20%, rgba(255, 255, 255, .48) 0%, transparent 100%),
        radial-gradient(1px 1px at 35% 78%, rgba(255, 255, 255, .28) 0%, transparent 100%),
        radial-gradient(2px 2px at 88% 65%, rgba(255, 255, 255, .36) 0%, transparent 100%),
        radial-gradient(1px 1px at 7% 88%, rgba(255, 255, 255, .28) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 60% 85%, rgba(255, 255, 255, .32) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 48%, rgba(255, 255, 255, .22) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 35%, rgba(255, 255, 255, .30) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 18% 38%, rgba(255, 255, 255, .25) 0%, transparent 100%);
    }

    /* ── TOP NAV ── */
    .topnav {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 36px;
      border-bottom: 1px solid rgba(255, 255, 255, .12);
    }

    .topnav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-shield {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 14px rgba(234, 88, 12, .40);
    }

    .logo-shield svg {
      width: 22px;
      height: 22px;
      fill: white;
    }

    .logo-name {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.4rem;
      color: white;
    }

    .topnav-user {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .user-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4c6ef5, #748ffc);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.1rem;
      color: white;
      border: 2.5px solid rgba(255, 255, 255, .55);
      box-shadow: 0 3px 14px rgba(0, 0, 0, .22);
      flex-shrink: 0;
    }

    .user-info {
      text-align: right;
    }

    .user-info .user-greet {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      color: white;
    }

    .user-info .user-logout {
      display: block;
      font-size: 0.80rem;
      color: rgba(255, 255, 255, .68);
      cursor: pointer;
      background: none;
      border: none;
      font-family: 'Inter', sans-serif;
      text-align: right;
      transition: color .2s;
      padding: 0;
    }

    .user-info .user-logout:hover {
      color: #fca5a5;
    }

    /* ── PAGE BODY ── */
    .page-body {
      flex: 1;
      display: flex;
      position: relative;
      z-index: 10;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      background: rgba(30, 10, 70, .65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 255, 255, .10);
      display: flex;
      flex-direction: column;
      padding: 24px 0 20px;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px 22px;
      color: rgba(255, 255, 255, .65);
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      position: relative;
      transition: background .2s, color .2s;
      border-radius: 0;
    }

    .nav-item .nav-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      background: rgba(255, 255, 255, .10);
      transition: background .2s;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, .08);
      color: white;
    }

    .nav-item:hover .nav-icon {
      background: rgba(255, 255, 255, .18);
    }

    .nav-item.active {
      background: rgba(255, 255, 255, .12);
      color: white;
    }

    .nav-item.active .nav-icon {
      background: rgba(255, 255, 255, .25);
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, #f59e0b, #ea580c);
      border-radius: 0 2px 2px 0;
    }

    /* ── MAIN ── */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px 48px;
    }

    .main::-webkit-scrollbar {
      width: 5px;
    }

    .main::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .18);
      border-radius: 3px;
    }

    /* ── GLASS CARD ── */
    .glass-card {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .10);
    }

    /* panel header */
    .panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .panel-header-dot {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }

    .panel-header h3 {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.05rem;
      color: #1e1b4b;
    }

    @media (max-width: 860px) {
      .sidebar {
        display: none;
      }

      .main {
        padding: 20px 14px 36px;
      }

      .topnav {
        padding: 14px 18px;
      }
    }
  </style>
</head>

<body>

  <div class="bg-layer"></div>

  <!-- ── TOP NAV ── -->
  <header class="topnav">
    <a href="{% url 'student_dashboard' %}" class="topnav-logo">
      <div class="logo-shield">
        <svg viewBox="0 0 24 24">
          <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z" />
        </svg>
      </div>
      <span class="logo-name">EduLink</span>
    </a>

    <div class="topnav-user">
      <div class="user-info">
        <div class="user-greet">Welcome, {{ user.first_name }}!</div>
        <form method="POST" action="" style="display:inline;">
          {% csrf_token %}
          <button type="submit" class="user-logout">Logout</button>
        </form>
      </div>
      <div class="user-avatar">
        {{ user.first_name|first }}{{ user.last_name|first }}
      </div>
    </div>
  </header>

  <!-- ── BODY ── -->
  <div class="page-body">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <a href="{% url 'student_dashboard' %}" class="nav-item {% block nav_dashboard %}{% endblock %}">
        <div class="nav-icon">🔒</div> Dashboard
      </a>
      <a href="{% url 'student_dashboard2'%}" class="nav-item {% block nav_classes %}{% endblock %}">
        <div class="nav-icon">📚</div> My Classes
      </a>



    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">
      {% block content %}{% endblock %}
    </main>

  </div><!-- /page-body -->

  {% block extra_js %}{% endblock %}
</body>

</html>
